name: Reiseplaner · Branch-Qualitätsprüfung

on:
  push:
    branches: [feature/v7-resilient-seed-fallback, feature/v7-curated-research-v02, feature/v7-verification-sources-2027, feature/v7-unified-map-and-day-builder, feature/v7-data-day-accommodation-rail]
  pull_request:
    paths:
      - "outputs/Reiseplaner/**"
      - ".github/workflows/reiseplaner-ci.yml"
  workflow_dispatch:

concurrency:
  group: reiseplaner-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  portable:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: outputs/Reiseplaner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Syntaxprüfungen aller JavaScript-Module
        run: find . -name '*.mjs' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check
      - name: Alle 16 kanonischen Research-v0.2-Datensätze prüfen
        run: python3 data/research-v02/validate_subset.py
      - name: Isolierte Seed- und Readiness-Tests
        run: npm run test:portable
      - name: Karten-Datenabdeckung für alle Reisen und Städte
        run: npm run report:map
      - name: Echter Chrome-Browsertest für Warenkorb und Mobilansicht
        run: node test/portable-browser.mjs
      - name: Server-Smoke-Test ohne private Tripsy-Dateien
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createApp } from './server.mjs';
          const { server } = await createApp({ database: ':memory:', upstream: false });
          await new Promise(resolve => server.listen(0, '127.0.0.1', resolve));
          try {
            const base = 'http://127.0.0.1:' + server.address().port;
            const res = await fetch(base + '/api/bootstrap');
            assert.equal(res.status, 200);
            const data = await res.json();
            assert.equal(data.trips.length, 4);
            assert.ok(data.trips.every(trip => trip.dataMode === 'research_seed_fallback'));
            const page = await fetch(base + '/');
            assert.equal(page.status, 200);
            assert.match(await page.text(), /<html/i);
            console.log('PASS: four separate trips, offline fallback, HTML');
          } finally {
            await new Promise(resolve => server.close(resolve));
          }
          NODE

  # One-time public-address research. Idempotent: once candidates are committed,
  # subsequent runs skip all external queries. No Airbnb location requests.
  public-address-audit:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feature/v7-data-day-accommodation-rail' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v7-data-day-accommodation-rail
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Audit 41 independently published addresses once (no invented geo pins)
        run: |
          if test -s outputs/Reiseplaner/data/research-v09/address-candidates.json; then
            echo "Verified address candidate inventory already exists; no repeat public requests."
            exit 0
          fi
          cd outputs/Reiseplaner
          node scripts/public-address-geo-v09.mjs
          cd ../..
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add outputs/Reiseplaner/data/research-v09/address-candidates.json
          git commit -m "research: one-time check of exact public hotel street numbers"
          git pull --rebase origin feature/v7-data-day-accommodation-rail
          git push origin HEAD:feature/v7-data-day-accommodation-rail
